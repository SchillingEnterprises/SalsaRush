name: Salsa Rush Django CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master, chore/engineering-quality-modernization]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: salsa-rush-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Django quality checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    defaults:
      run:
        working-directory: salsaRush
    env:
      DJANGO_SECRET_KEY: ci-only-deployment-check-key-long-enough-for-django-security-validation
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      DJANGO_DB_ENGINE: sqlite
      DJANGO_SECURE_SSL_REDIRECT: "false"
      DJANGO_SESSION_COOKIE_SECURE: "false"
      DJANGO_CSRF_COOKIE_SECURE: "false"
      DJANGO_HSTS_SECONDS: "0"
      DJANGO_DB_NAME: /tmp/salsa-rush-ci.sqlite3
    steps:
      - name: Check out source without the tracked SQLite database
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: |
            /*
            !/salsaRush/db.sqlite3
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Verify the tracked database is excluded from the CI workspace
        working-directory: .
        run: test ! -e salsaRush/db.sqlite3

      - name: Ensure the preserved database is unchanged from the base revision
        if: github.event_name != 'workflow_dispatch'
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            comparison_base="$BASE_SHA"
          else
            comparison_base="$BEFORE_SHA"
          fi

          if [[ -z "$comparison_base" || "$comparison_base" =~ ^0+$ ]]; then
            echo "::notice::No comparison revision is available for this event."
            exit 0
          fi

          # Supply the short-lived workflow token to this one fetch only; never persist it in local Git config.
          auth_header="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          git -c http.extraheader="AUTHORIZATION: basic $auth_header" -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin "$comparison_base"
          base_blob="$(git -C "$GITHUB_WORKSPACE" ls-tree "$comparison_base" -- salsaRush/db.sqlite3 | awk '{print $3}')"
          head_blob="$(git -C "$GITHUB_WORKSPACE" ls-tree "$GITHUB_SHA" -- salsaRush/db.sqlite3 | awk '{print $3}')"

          if [[ -z "$base_blob" || "$base_blob" != "$head_blob" ]]; then
            echo "::error::The preserved SQLite database must not be modified, replaced, or removed before the owner approves a private backup, retention decision, and history-remediation plan."
            exit 1
          fi

          echo "The tracked database Git object is unchanged from the base revision."


      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v6.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r ../requirements.txt

      - name: Run repository database configuration contracts
        working-directory: .
        run: python -m unittest discover -s tests -v

      - name: Compile Python sources
        run: python -m compileall -q website salsaRush

      - name: Check Django configuration
        run: python manage.py check

      - name: Check production security configuration
        env:
          DJANGO_SECRET_KEY: "ci-only-deployment-check-key-long-enough-for-django-security-validation"
          DJANGO_DEBUG: "false"
          DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,testserver"
          DJANGO_SECURE_SSL_REDIRECT: "true"
          DJANGO_SESSION_COOKIE_SECURE: "true"
          DJANGO_CSRF_COOKIE_SECURE: "true"
          DJANGO_HSTS_SECONDS: "31536000"
          DJANGO_DB_ENGINE: postgresql
          DJANGO_DB_NAME: salsa-rush-ci-check
          DJANGO_DB_USER: salsa-rush-ci-check
          DJANGO_DB_PASSWORD: ci-only-not-a-real-password
          DJANGO_DB_HOST: db.example.test
          DJANGO_DB_PORT: "5432"
          DJANGO_DB_SSLMODE: verify-full
        run: python manage.py check --deploy --fail-level ERROR

      - name: Verify migrations match models
        run: python manage.py makemigrations --check --dry-run

      - name: Apply migrations to disposable CI database
        run: python manage.py migrate --noinput

      - name: Run application tests
        run: python manage.py test website --verbosity 2

