name: Salsa Rush Django CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master, chore/engineering-quality-modernization]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: salsa-rush-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Django quality checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    defaults:
      run:
        working-directory: salsaRush
    env:
      DJANGO_SECRET_KEY: ci-only-secret-key-not-for-deployment
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      DJANGO_DB_ENGINE: sqlite
      DJANGO_SECURE_SSL_REDIRECT: "false"
      DJANGO_SESSION_COOKIE_SECURE: "false"
      DJANGO_CSRF_COOKIE_SECURE: "false"
      DJANGO_HSTS_SECONDS: "0"
      DJANGO_DB_NAME: /tmp/salsa-rush-ci.sqlite3
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v6.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r ../requirements.txt
      - name: Run repository database configuration contracts
        working-directory: .
        run: python -m unittest discover -s tests -v
      - name: Compile Python sources
        run: python -m compileall -q website salsaRush
      - name: Check Django configuration
        run: python manage.py check
      - name: Check production security configuration
        env:
          DJANGO_DEBUG: "false"
          DJANGO_SECURE_SSL_REDIRECT: "true"
          DJANGO_SESSION_COOKIE_SECURE: "true"
          DJANGO_CSRF_COOKIE_SECURE: "true"
          DJANGO_HSTS_SECONDS: "31536000"
          DJANGO_HSTS_PRELOAD: "true"
        run: python manage.py check --deploy
      - name: Verify migrations match models
        run: python manage.py makemigrations --check --dry-run
      - name: Apply migrations to disposable CI database
        run: python manage.py migrate --noinput
      - name: Run application tests
        run: python manage.py test website --verbosity 2
